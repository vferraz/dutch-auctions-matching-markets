<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Timing, Entry, and Revenue — v3 · Interactive Companion</title>
<link rel="icon" href="data:,">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400;0,500;0,600;0,700;1,400;1,500&family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">

<style>
  :root {
    --bg:    #EEF0F3;
    --paper: #F7F8FA;
    --panel: #FFFFFF;
    --ink:   #131210;
    --ink2:  #36322C;
    --muted: #6B6F76;
    --faint: #BFC2C8;
    --rule:  #D9DCE2;
    --rule-soft: #E5E7EB;
    --grid:  #ECEEF1;
    --dark:  #F7F8FA;
    --DA:    #2B6CB0;
    --DAtint:#E6EEF7;
    --FPi:   #C05621;
    --FPitint:#FBEEDC;
    --FPb:   #9B2C2C;
    --amber: #E6A23C;
    --shadow: 0 1px 0 rgba(15,15,15,.03), 0 4px 16px -10px rgba(15,15,15,.07);
    --shadow-dark: 0 8px 28px -16px rgba(15,15,15,.18);
  }

  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    font-family: "EB Garamond", "Palatino Linotype", Palatino, Georgia, serif;
    background: var(--bg);
    color: var(--ink);
    font-size: 16px;
    line-height: 1.5;
    -webkit-font-smoothing: antialiased;
  }
  code, .mono { font-family: "JetBrains Mono", "SF Mono", Menlo, monospace; }
  em { font-style: italic; }
  strong { font-weight: 600; }
  a { color: var(--ink2); text-decoration: underline; text-decoration-color: var(--faint); }
  a:hover { text-decoration-color: var(--ink); }

  .appv3 {
    max-width: 1640px;
    margin: 0 auto;
    padding: 36px 40px 80px;
  }

  /* ── MASTHEAD ─────────────────────────────────────────────── */
  .masthead-v3 {
    display: grid;
    grid-template-columns: 1fr 1.1fr;
    gap: 60px;
    align-items: end;
    padding-bottom: 24px;
    border-bottom: 1px solid var(--rule);
    margin-bottom: 40px;
  }
  .m3-eyebrow {
    font-family: "Inter", sans-serif;
    text-transform: uppercase;
    letter-spacing: 0.13em;
    font-size: 10.5px;
    color: var(--muted);
    font-weight: 600;
    margin-bottom: 14px;
  }
  .m3-title {
    font-family: "EB Garamond", serif;
    font-weight: 600;
    font-size: 52px;
    line-height: 1.0;
    margin: 0;
    letter-spacing: -0.018em;
  }
  .m3-sub {
    font-family: "EB Garamond", serif;
    font-style: italic;
    font-size: 26px;
    color: var(--ink2);
    margin: 6px 0 0;
    font-weight: 400;
  }
  .m3-blurb {
    font-size: 16px;
    color: var(--ink2);
    margin: 0 0 12px;
    max-width: 62ch;
  }
  .m3-meta {
    font-family: "Inter", sans-serif;
    font-size: 11.5px;
    color: var(--muted);
  }

  /* ── SECTION HEADERS (light, restrained) ──────────────────── */
  .section-pretitle {
    display: flex;
    align-items: baseline;
    gap: 22px;
    margin-bottom: 14px;
  }
  .section-pretitle h2 {
    font-family: "EB Garamond", serif;
    font-weight: 600;
    font-size: 22px;
    margin: 0;
    letter-spacing: -0.005em;
    flex-shrink: 0;
  }
  .section-pretitle p {
    font-size: 14px;
    color: var(--muted);
    margin: 0;
    line-height: 1.45;
    max-width: 78ch;
  }
  .section-pretitle p em { color: var(--ink2); }
  .section-pretitle p code {
    background: #00000008;
    padding: 1px 5px;
    border-radius: 3px;
    font-size: 12px;
  }

  /* ── SCENARIOS (prominent cards) ──────────────────────────── */
  .scenarios-section { margin-bottom: 32px; }
  .scenario-cards {
    display: grid;
    grid-template-columns: repeat(6, 1fr);
    gap: 12px;
  }
  .scenario-card {
    text-align: left;
    background: var(--paper);
    border: 1px solid var(--rule);
    border-radius: 6px;
    padding: 14px 14px 12px;
    cursor: pointer;
    transition: all 0.14s;
    font-family: inherit;
    color: inherit;
    box-shadow: var(--shadow);
  }
  .scenario-card:hover {
    border-color: var(--ink2);
    transform: translateY(-1px);
  }
  .scenario-card.active {
    background: var(--ink);
    border-color: var(--ink);
    color: var(--paper);
  }
  .scenario-card.active .scenario-desc { color: rgba(245,242,234,0.75); }
  .scenario-head {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 6px;
  }
  .scenario-name {
    font-family: "EB Garamond", serif;
    font-style: italic;
    font-weight: 600;
    font-size: 17px;
    white-space: nowrap;
  }
  .scenario-active {
    font-size: 8px;
    color: var(--amber);
  }
  .scenario-desc {
    font-family: "Inter", sans-serif;
    font-size: 11.5px;
    color: var(--muted);
    line-height: 1.4;
    margin: 0;
  }

  /* ── THEATER ───────────────────────────────────────────── */
  .theater-section {
    margin-bottom: 40px;
  }
  .theater {
    background: var(--panel);
    border-radius: 8px;
    overflow: hidden;
    box-shadow: var(--shadow);
    border: 1px solid var(--rule);
  }
  .theater-chrome {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 12px 20px;
    background: var(--paper);
    border-bottom: 1px solid var(--rule-soft);
  }
  .theater-title {
    display: flex;
    align-items: center;
    gap: 12px;
    font-family: "Inter", sans-serif;
    font-size: 12px;
    color: var(--ink);
    font-weight: 600;
    letter-spacing: 0.08em;
    text-transform: uppercase;
  }
  .theater-title .dot {
    width: 8px; height: 8px; border-radius: 50%;
    background: #E04848;
  }
  .theater-title .dot.blink { animation: pulse-rec 1.4s infinite; }
  @keyframes pulse-rec {
    0% { box-shadow: 0 0 0 0 rgba(224,72,72,0.5); }
    70% { box-shadow: 0 0 0 8px rgba(224,72,72,0); }
    100% { box-shadow: 0 0 0 0 rgba(224,72,72,0); }
  }
  .theater-time {
    margin-left: 14px;
    font-family: "JetBrains Mono", monospace;
    font-size: 11px;
    color: var(--muted);
    text-transform: none;
    letter-spacing: 0;
    font-weight: 400;
  }
  .theater-time strong {
    color: var(--ink);
    font-weight: 600;
  }
  .theater-controls {
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .ctrl {
    font-family: "Inter", sans-serif;
    font-size: 12px;
    font-weight: 500;
    padding: 6px 14px;
    background: #FFFFFF;
    border: 1px solid var(--rule);
    border-radius: 4px;
    color: var(--ink2);
    cursor: pointer;
    transition: all 0.12s;
  }
  .ctrl:hover { background: var(--bg); color: var(--ink); border-color: var(--ink2); }
  .ctrl.primary {
    background: var(--DA);
    border-color: var(--DA);
    color: #fff;
    min-width: 90px;
  }
  .ctrl.primary:hover { background: #3179C2; border-color: #3179C2; color: #fff; }
  .speed {
    display: flex;
    align-items: center;
    gap: 8px;
    margin-left: 6px;
  }
  .speed label {
    font-family: "Inter", sans-serif;
    font-size: 10px;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    color: var(--muted);
  }
  .speed input[type=range] {
    width: 80px;
    -webkit-appearance: none; appearance: none;
    background: transparent;
    height: 14px;
  }
  .speed input[type=range]::-webkit-slider-runnable-track {
    height: 2px; background: var(--rule); border-radius: 1px;
  }
  .speed input[type=range]::-moz-range-track {
    height: 2px; background: var(--rule); border-radius: 1px;
  }
  .speed input[type=range]::-webkit-slider-thumb {
    -webkit-appearance: none; appearance: none;
    width: 10px; height: 10px; border-radius: 50%;
    background: var(--ink); border: none; margin-top: -4px;
  }
  .speed input[type=range]::-moz-range-thumb {
    width: 10px; height: 10px; border-radius: 50%;
    background: var(--ink); border: none;
  }
  .speed-val {
    font-family: "JetBrains Mono", monospace;
    font-size: 10.5px;
    color: var(--ink2);
    min-width: 32px;
    text-align: right;
  }
  .theater-stage {
    position: relative;
    background: var(--panel);
    padding: 4px 0 0;
  }
  .scrubber {
    position: absolute;
    bottom: 14px;
    left: 10.9375%;
    right: 7.8125%;
    width: auto;
    -webkit-appearance: none;
    appearance: none;
    background: transparent;
    height: 18px;
    cursor: grab;
  }
  .scrubber::-webkit-slider-runnable-track { height: 2px; background: transparent; }
  .scrubber::-moz-range-track { height: 2px; background: transparent; }
  .scrubber::-webkit-slider-thumb {
    -webkit-appearance: none; appearance: none;
    width: 14px; height: 14px; border-radius: 50%;
    background: var(--ink);
    border: 2px solid #FFFFFF;
    box-shadow: 0 0 0 1px var(--rule), 0 2px 6px rgba(15,15,15,0.18);
    margin-top: -7px;
  }
  .scrubber::-moz-range-thumb {
    width: 14px; height: 14px; border-radius: 50%;
    background: var(--ink);
    border: 2px solid #FFFFFF;
    box-shadow: 0 0 0 1px var(--rule);
  }
  .theater-legend {
    display: flex; flex-wrap: wrap; gap: 16px; align-items: center;
    padding: 10px 20px 12px;
    background: var(--paper);
    border-top: 1px solid var(--rule-soft);
    font-family: "Inter", sans-serif;
    font-size: 11px;
    color: var(--muted);
  }
  .theater-legend .swatch {
    display: inline-block;
    width: 9px; height: 9px;
    border-radius: 50%;
    margin-right: 6px;
    vertical-align: -1px;
  }
  .swatch-da { background: #2B6CB0; }
  .swatch-pp { background: #C05621; }
  .swatch-bat { background: #9B2C2C; }
  .swatch-pending {
    background: transparent;
    border: 1.5px solid #E6A23C;
    width: 8px; height: 8px;
  }
  .swatch-rej { background: #A8ADB5; }
  .legend-explainer { margin-left: auto; font-style: italic; color: var(--muted); }
  .legend-explainer em {
    color: var(--ink2);
    font-family: "EB Garamond", serif;
    font-size: 13px;
  }

  /* ── CLASSIFIER + EXPLAINER ─────────────────────────────── */
  .classifier-section { margin-bottom: 44px; }
  .classifier-grid {
    display: grid;
    grid-template-columns: 1.05fr 1fr;
    gap: 32px;
    align-items: center;
    background: var(--panel);
    border: 1px solid var(--rule);
    border-radius: 6px;
    padding: 24px 28px;
    box-shadow: var(--shadow);
  }
  .classifier-plot { min-width: 0; }

  .case-explainer { min-width: 0; }
  .case-meta {
    display: flex;
    align-items: center;
    gap: 14px;
    margin-bottom: 8px;
  }
  .case-num {
    font-family: "Inter", sans-serif;
    font-size: 10.5px;
    font-weight: 700;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--muted);
  }
  .case-pill {
    font-family: "Inter", sans-serif;
    font-size: 11px;
    font-weight: 600;
    letter-spacing: 0.06em;
    padding: 3px 10px;
    border-radius: 3px;
    text-transform: uppercase;
  }
  .case-pill .muted {
    font-weight: 400;
    text-transform: none;
    letter-spacing: 0;
    margin-left: 6px;
    opacity: 0.75;
  }
  .case-pill.win-da {
    background: var(--DAtint);
    color: var(--DA);
  }
  .case-pill.win-pp {
    background: var(--FPitint);
    color: var(--FPi);
  }
  .case-title {
    font-family: "EB Garamond", serif;
    font-weight: 600;
    font-size: 28px;
    margin: 4px 0 0;
    line-height: 1.1;
    letter-spacing: -0.008em;
  }
  .case-tag {
    font-family: "Inter", sans-serif;
    font-size: 12px;
    color: var(--muted);
    margin: 4px 0 14px;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    font-weight: 500;
  }
  .case-story {
    font-size: 16px;
    color: var(--ink2);
    line-height: 1.55;
    margin: 0 0 12px;
  }
  .case-rule {
    font-size: 14.5px;
    color: var(--ink);
    margin: 0;
    padding: 10px 14px;
    background: var(--paper);
    border: 1px solid var(--rule);
    border-radius: 4px;
  }
  .case-rule .mono {
    font-family: "JetBrains Mono", monospace;
    font-size: 12.5px;
    font-weight: 500;
    background: #00000008;
    padding: 1px 5px;
    border-radius: 3px;
  }

  /* ── PANELS (2 × 3) ─────────────────────────────────────── */
  .panels-section-v3 { margin-bottom: 40px; }
  .panels-grid-v3 {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 16px;
    margin-bottom: 14px;
  }
  .panel-v3 {
    background: var(--panel);
    border: 1px solid var(--rule);
    border-radius: 5px;
    padding: 14px 16px 10px;
    margin: 0;
    box-shadow: var(--shadow);
  }
  .panel-v3 header { margin-bottom: 6px; }
  .panel-v3 h4 {
    font-family: "EB Garamond", serif;
    font-weight: 600;
    font-size: 17px;
    margin: 0;
    line-height: 1.2;
    letter-spacing: -0.005em;
  }
  .panel-v3 .sub {
    font-family: "Inter", sans-serif;
    font-size: 11.5px;
    color: var(--muted);
    margin: 3px 0 0;
    line-height: 1.4;
  }
  .panel-v3 .sub em {
    font-family: "EB Garamond", serif;
    font-style: italic;
    font-size: 13px;
    color: var(--ink2);
  }

  /* Shared legend card */
  .chart-legend {
    background: var(--paper);
    border: 1px solid var(--rule);
    border-radius: 5px;
    padding: 12px 18px;
    display: grid;
    grid-template-columns: 1.4fr 1fr;
    gap: 18px;
    align-items: center;
  }
  .legend-rows {
    display: flex;
    flex-direction: column;
    gap: 4px;
  }
  .legend-row {
    display: flex;
    align-items: center;
    gap: 10px;
    font-family: "Inter", sans-serif;
    font-size: 12px;
    color: var(--ink2);
  }
  .legend-note {
    font-family: "Inter", sans-serif;
    font-size: 11.5px;
    color: var(--muted);
    margin: 0;
    line-height: 1.45;
    border-left: 2px solid var(--rule);
    padding-left: 12px;
  }
  .legend-note em {
    font-family: "EB Garamond", serif;
    font-style: italic;
    font-size: 13px;
    color: var(--ink2);
  }

  /* ── EQUILIBRIUM BARS ───────────────────────────────────── */
  .eq-section-v3 { margin-bottom: 44px; }
  .eq-bars {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 22px 32px;
    background: var(--panel);
    border: 1px solid var(--rule);
    border-radius: 6px;
    padding: 24px 28px;
    box-shadow: var(--shadow);
  }
  .eq-row { min-width: 0; }
  .eq-row-head { margin-bottom: 8px; }
  .eq-row-label {
    font-family: "EB Garamond", serif;
    font-weight: 600;
    font-size: 16px;
    color: var(--ink);
  }
  .eq-row-hint {
    display: block;
    font-family: "Inter", sans-serif;
    font-size: 11px;
    color: var(--muted);
    margin-top: 1px;
  }
  .eq-row-bars { display: flex; flex-direction: column; gap: 4px; }
  .eq-bar {
    display: grid;
    grid-template-columns: 64px 1fr 70px;
    align-items: center;
    gap: 10px;
  }
  .eq-bar-mech {
    font-family: "Inter", sans-serif;
    font-weight: 600;
    font-size: 11.5px;
    letter-spacing: 0.02em;
  }
  .eq-bar-track {
    height: 14px;
    background: var(--rule-soft);
    border-radius: 2px;
    overflow: hidden;
    position: relative;
  }
  .eq-bar-fill {
    height: 100%;
    border-radius: 2px;
    transition: width 0.25s ease-out;
    opacity: 0.85;
  }
  .eq-bar.best .eq-bar-fill { opacity: 1; }
  .eq-bar-val {
    font-family: "JetBrains Mono", monospace;
    font-size: 12.5px;
    color: var(--ink);
    text-align: right;
    font-variant-numeric: tabular-nums;
  }
  .eq-bar.best .eq-bar-val {
    font-weight: 600;
  }
  .best-star {
    color: var(--amber);
    margin-left: 4px;
    font-size: 11px;
  }

  /* ── PARAMETERS (demoted) ──────────────────────────────── */
  .params-section { margin-bottom: 24px; }
  .params-header {
    display: flex;
    justify-content: space-between;
    align-items: flex-end;
    margin-bottom: 16px;
    padding-top: 18px;
    border-top: 1px solid var(--rule);
  }
  .params-header h2 {
    font-family: "EB Garamond", serif;
    font-weight: 600;
    font-size: 22px;
    margin: 0;
    letter-spacing: -0.005em;
  }
  .params-header p {
    font-size: 13.5px;
    color: var(--muted);
    margin: 4px 0 0;
  }
  .params-toggle {
    font-family: "Inter", sans-serif;
    font-size: 11.5px;
    font-weight: 500;
    background: transparent;
    border: 1px solid var(--rule);
    color: var(--ink2);
    padding: 5px 14px;
    border-radius: 3px;
    cursor: pointer;
    transition: all 0.12s;
  }
  .params-toggle:hover {
    border-color: var(--ink);
    color: var(--ink);
  }

  .params-grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 16px;
  }
  .param-cluster {
    background: var(--paper);
    border: 1px solid var(--rule);
    border-radius: 6px;
    padding: 16px 18px 6px;
  }
  .param-cluster header { margin-bottom: 10px; }
  .param-cluster h4 {
    font-family: "EB Garamond", serif;
    font-style: italic;
    font-weight: 600;
    font-size: 16px;
    margin: 0;
    color: var(--ink);
  }
  .param-cluster header p {
    font-family: "Inter", sans-serif;
    font-size: 11px;
    color: var(--muted);
    margin: 2px 0 0;
    line-height: 1.4;
  }
  .param-sliders {
    display: flex;
    flex-direction: column;
    gap: 12px;
  }
  .param-slider { position: relative; }
  .param-slider-head {
    display: flex;
    align-items: baseline;
    gap: 6px;
    margin-bottom: 3px;
  }
  .ps-math {
    font-family: "EB Garamond", serif;
    font-style: italic;
    font-weight: 600;
    font-size: 15px;
    color: var(--ink);
    min-width: 16px;
  }
  .ps-label {
    font-family: "Inter", sans-serif;
    font-size: 11px;
    color: var(--muted);
  }
  .ps-val {
    margin-left: auto;
    font-family: "JetBrains Mono", monospace;
    font-size: 11px;
    color: var(--ink);
    background: #fff;
    padding: 1px 5px;
    border-radius: 3px;
    border: 1px solid var(--rule);
  }
  .ps-tip {
    font-family: "Inter", sans-serif;
    font-size: 10.5px;
    color: var(--muted);
    margin-top: 2px;
    line-height: 1.35;
    opacity: 0;
    max-height: 0;
    overflow: hidden;
    transition: opacity 0.15s, max-height 0.15s;
  }
  .param-slider:hover .ps-tip {
    opacity: 1;
    max-height: 50px;
  }
  .param-slider input[type="range"] {
    width: 100%;
    -webkit-appearance: none;
    appearance: none;
    height: 14px;
    background: transparent;
    cursor: pointer;
  }
  .param-slider input[type="range"]::-webkit-slider-runnable-track {
    height: 3px; background: var(--rule); border-radius: 2px;
  }
  .param-slider input[type="range"]::-moz-range-track {
    height: 3px; background: var(--rule); border-radius: 2px;
  }
  .param-slider input[type="range"]::-webkit-slider-thumb {
    -webkit-appearance: none; appearance: none;
    width: 12px; height: 12px;
    border-radius: 50%;
    background: var(--ink);
    border: 2px solid #fff;
    box-shadow: 0 0 0 1px var(--rule);
    margin-top: -5px;
  }
  .param-slider input[type="range"]::-moz-range-thumb {
    width: 12px; height: 12px;
    border-radius: 50%;
    background: var(--ink);
    border: 2px solid #fff;
    box-shadow: 0 0 0 1px var(--rule);
  }

  /* ── FOOTER ────────────────────────────────────────────── */
  .foot-v3 {
    display: flex;
    justify-content: space-between;
    border-top: 1px solid var(--rule);
    padding-top: 18px;
    margin-top: 24px;
    font-family: "Inter", sans-serif;
    font-size: 11.5px;
    color: var(--muted);
    gap: 16px;
    flex-wrap: wrap;
  }
